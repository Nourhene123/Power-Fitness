<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="pfGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9ac54"/>
      <stop offset="100%" stop-color="#d4872c"/>
    </linearGradient>
    <linearGradient id="pfGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pfDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f9ac54" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Hexagonal / Shield Outer Ring -->
  <path d="M24 3L41 12.5V35.5L24 45L7 35.5V12.5L24 3Z" 
