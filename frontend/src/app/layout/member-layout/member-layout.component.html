<div class="member-shell" [class.sidebar-collapsed]="collapsed()" [attr.data-theme]="theme.theme()">
  <aside id="member-nav" class="member-sidebar" [class.open]="sidebarOpen()">
    <button
      type="button"
      class="sidebar-collapse-btn"
      (click)="toggleSidebarPanel()"
      aria-controls="member-nav"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="expanded() ? 'Collapse sidebar' : 'Expand sidebar'"
    >
      <i [class]="expanded() ? 'ri-arrow-left-s-line' : 'ri-arrow-right-s-line'"></i>
    </button>

    <div class="sidebar-header">
      <a routerLink="/" class="logo">
        <img src="assets/img/logo-gold.webp" alt="Power Fitness Logo" />
      </a>
      <span class="sidebar-badge-client"><i class="ri-user-star-fill"></i> MEMBER</span>
    </div>

    <nav class="sidebar-menu">
      <div class="menu-label">My Journey</div>
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          class="sidebar-link"
          [title]="link.label"
          (click)="closeSidebar()"
        >
          <i [class]="link.icon"></i><span>{{ link.label }}</span>
        </a>
      }
      <div class="menu-label" style="margin-top: 12px">Store &amp; Account</div>
      @for (link of storeLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          class="sidebar-link"
          [title]="link.label"
          (click)="closeSidebar()"
        >
          <i [class]="link.icon"></i><span>{{ link.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar-client">{{ initial() }}</div>
        <div class="info">
          <div class="name">{{ name() }}</div>
          <div class="role">Active Member</div>
        </div>
        <button type="button" (click)="logout()" title="Logout" class="logout-btn">
          <i class="ri-logout-box-r-line"></i>
        </button>
      </div>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <!-- Phones: dims the page behind the open menu; tapping it closes the menu. -->
    <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <div class="member-main">
    <header class="member-header">
      <div class="header-left">
      </div>
      <div class="header-right">
        <button type="button" class="header-btn header-btn-cart" (click)="cart.openDrawer()">
          <i class="ri-shopping-bag-3-fill"></i>
          @if (cart.count() > 0) {
            <span class="cart-badge">{{ cart.count() }}</span>
          }
        </button>
        <a routerLink="/shop" class="header-btn header-btn-primary">
          <i class="ri-shopping-bag-3-fill"></i> Shop Now
        </a>
        <app-notif-bell />
        <button
          type="button"
          class="header-btn header-btn-theme"
          (click)="theme.toggle()"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <i [class]="theme.theme() === 'dark' ? 'ri-sun-line' : 'ri-moon-line'"></i>
        </button>
        <button type="button" (click)="logout()" class="header-btn header-btn-logout">
          <i class="ri-logout-box-r-line"></i>
        </button>
      </div>
    </header>

    <div class="dashboard-container">
      <router-outlet />
    </div>
  </div>
</div>
