<div class="coach-shell" [class.sidebar-collapsed]="collapsed()" [attr.data-theme]="theme.theme()">
  <aside id="coach-nav" class="coach-sidebar" [class.open]="sidebarOpen()">
    <button
      type="button"
      class="sidebar-collapse-btn"
      (click)="toggleSidebarPanel()"
      aria-controls="coach-nav"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="expanded() ? 'Collapse sidebar' : 'Expand sidebar'"
    >
      <i [class]="expanded() ? 'ri-arrow-left-s-line' : 'ri-arrow-right-s-line'"></i>
    </button>

    <div class="sidebar-header">
      <a routerLink="/" class="logo">
        <img src="assets/img/logo-gold.webp" alt="Power Fitness Logo" />
      </a>
      <span class="sidebar-badge"><i class="ri-shield-star-fill"></i> {{ roleLabel().toUpperCase() }}</span>
    </div>

    <nav class="sidebar-menu">
      <div class="menu-label">Main Navigation</div>
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          class="sidebar-link"
          [title]="link.label"
          (click)="closeSidebar()"
        >
          <i [class]="link.icon"></i><span>{{ link.label }}</span>
        </a>
      }
      <div class="menu-label">Quick Links</div>
      <a routerLink="/" class="sidebar-link" title="Back to homepage" (click)="closeSidebar()"><i class="ri-home-4-line"></i><span>Back to homepage</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">{{ initial() }}</div>
        <div class="info">
          <div class="name">{{ name() }}</div>
          <div class="role"><i class="ri-shield-check-fill"></i> {{ roleLabel() }}</div>
        </div>
        <button type="button" (click)="logout()" title="Logout" class="logout-btn">
          <i class="ri-logout-box-r-line"></i>
        </button>
      </div>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <!-- Phones: dims the page behind the open menu; tapping it closes the menu. -->
    <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <div class="coach-main">
    <header class="coach-header">
      <div class="header-left">
      </div>
      <div class="header-right">
        <app-notif-bell />
        <button
          type="button"
          class="header-btn header-btn-theme"
          (click)="theme.toggle()"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <i [class]="theme.theme() === 'dark' ? 'ri-sun-line' : 'ri-moon-line'"></i>
        </button>
        <button type="button" (click)="logout()" class="header-btn header-btn-logout">
          <i class="ri-logout-box-r-line"></i> Logout
        </button>
      </div>
    </header>

    <div class="coach-container">
      <router-outlet />
    </div>
  </div>
</div>
